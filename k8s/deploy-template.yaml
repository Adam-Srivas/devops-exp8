apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgsite-COLOR
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bgsite
      color: COLOR
  template:
    metadata:
      labels:
        app: bgsite
        color: COLOR
    spec:
      containers:
      - name: bgsite
        image: adamyasrivastava/mysite:IMAGE_TAG
        ports:
        - containerPort: 80
